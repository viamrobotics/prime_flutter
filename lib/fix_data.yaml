# Data-driven fixes for prime_flutter, applied by `dart fix`.
#
# Each transform migrates code off a deprecated API. When you deprecate or
# rename something, add a transform here and a case to test_fixes/.
# Format: https://github.com/flutter/flutter/blob/master/docs/contributing/Data-driven-Fixes.md

version: 1
transforms:
  - title: "Rename to 'Scaffold'"
    date: 2026-11-20
    element:
      uris: ['package:prime_flutter/prime_flutter.dart']
      typedef: 'PrimeScaffold'
    changes:
      - kind: 'rename'
        newName: 'Scaffold'

