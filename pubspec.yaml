name: prime_flutter
description: "Pretty Rad Interactive Modular Elements. A collection of UI elements for Flutter, implementing Viam's design system."
version: 0.3.3
homepage: https://github.com/viamrobotics/prime_flutter
repository: https://github.com/viamrobotics/prime_flutter
documentation: https://design-mobile.viam.com

environment:
  sdk: ^3.10.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  fonts:
    - family: PrimeIcons
      fonts:
        - asset: fonts/PrimeIcons.ttf
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono.ttf
    - family: Public Sans
      fonts:
        - asset: fonts/PublicSans-Regular.ttf
        - asset: fonts/PublicSans-Medium.ttf
          weight: 500
        - asset: fonts/PublicSans-SemiBold.ttf
          weight: 600
        - asset: fonts/PublicSans-Bold.ttf
          weight: 700
